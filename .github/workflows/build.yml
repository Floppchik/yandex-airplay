name: Build Static Musl shairport-sync for Yandex Station Mini

on:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-armhf-shairport:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build static shairport-sync inside Alpine ARMv7
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          docker run --rm --platform linux/arm/v7 -v "$GITHUB_WORKSPACE/dist:/dist" alpine:3.19 sh -e -c '
            apk add --no-cache \
              build-base \
              autoconf \
              automake \
              libtool \
              pkgconf \
              git \
              wget \
              bzip2 \
              tar \
              file \
              linux-headers \
              popt-dev \
              popt-static

            mkdir -p /tmp/deps && cd /tmp/deps
            wget -q -O alsa-lib.tar.bz2 https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.10.tar.bz2 || \
              wget -q -O alsa-lib.tar.bz2 https://fossies.org/linux/misc/alsa-lib-1.2.10.tar.bz2
            tar -xjf alsa-lib.tar.bz2
            cd alsa-lib-1.2.10
            ./configure \
              --prefix=/usr/local \
              --with-configdir=/system/workdir/lib/alsa \
              --enable-static \
              --disable-shared \
              --disable-python \
              --without-versioned \
              --with-debug=no
            make -j$(nproc) && make install

            git clone --branch v1.7.3 --depth 1 https://github.com/hyperrealm/libconfig.git /tmp/deps/libconfig
            cd /tmp/deps/libconfig
            autoreconf -fi
            ./configure \
              --prefix=/usr/local \
              --enable-static \
              --disable-shared \
              --disable-cxx \
              --disable-doc \
              --disable-examples \
              --disable-tests \
              CFLAGS="-std=gnu99 -O2"
            make -j$(nproc) && make install

            git clone --branch v2.28.8 --depth 1 https://github.com/Mbed-TLS/mbedtls.git /tmp/deps/mbedtls
            cd /tmp/deps/mbedtls
            make -j$(nproc) lib
            cp -r include/mbedtls /usr/local/include/
            cp library/libmbedcrypto.a library/libmbedtls.a library/libmbedx509.a /usr/local/lib/

            git clone --branch 3.3.9 --depth 1 https://github.com/mikebrady/shairport-sync.git /tmp/deps/shairport-sync
            cd /tmp/deps/shairport-sync
            autoreconf -fi
            PKG_CONFIG_PATH="/usr/local/lib/pkgconfig" \
            CFLAGS="-I/usr/local/include -std=gnu99 -O2 -D_GNU_SOURCE" \
            CPPFLAGS="-I/usr/local/include" \
            LDFLAGS="-L/usr/local/lib -static" \
            LIBS="-lmbedtls -lmbedx509 -lmbedcrypto -lasound -lpopt -lconfig -lpthread -lm" \
            ./configure \
              --prefix=/usr/local \
              --with-alsa \
              --with-tinysvcmdns \
              --with-ssl=mbedtls \
              --with-metadata
            make -j$(nproc) LDFLAGS="-static -L/usr/local/lib" LIBS="-lmbedtls -lmbedx509 -lmbedcrypto -lasound -lpopt -lconfig -lpthread -lm"
            strip shairport-sync
            cp shairport-sync /dist/shairport-sync
            file /dist/shairport-sync
          '

      - name: Upload shairport-sync artifact
        uses: actions/upload-artifact@v4
        with:
          name: shairport-sync-armhf-static
          path: dist/shairport-sync
          if-no-files-found: error
